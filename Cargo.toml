[package]
name = "chatmux"
version = "0.2.5"
edition = "2024"
description = "TUI session manager for AI coding agents"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
anyhow = "1"
ansi-to-tui = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
base64 = "0.22.1"
notify = "8.2.0"
shell-words = "1.1.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
