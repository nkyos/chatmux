<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c23152;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubble3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c3d8e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" />

  <!-- Back bubble (blue) - largest, bottom-left -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="220" height="150" rx="24" ry="24" fill="url(#bubble2)" opacity="0.85"/>
    <!-- Terminal cursor lines -->
    <rect x="28" y="36" width="100" height="8" rx="4" fill="#4a90d9" opacity="0.6"/>
    <rect x="28" y="58" width="70" height="8" rx="4" fill="#4a90d9" opacity="0.4"/>
    <rect x="28" y="80" width="130" height="8" rx="4" fill="#4a90d9" opacity="0.5"/>
    <!-- Bubble tail -->
    <polygon points="30,150 50,150 20,180" fill="url(#bubble2)" opacity="0.85"/>
  </g>

  <!-- Middle bubble (purple) - medium, center -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="220" height="150" rx="24" ry="24" fill="url(#bubble3)" opacity="0.9"/>
    <!-- Terminal cursor lines -->
    <rect x="28" y="36" width="80" height="8" rx="4" fill="#a06cd5" opacity="0.6"/>
    <rect x="28" y="58" width="120" height="8" rx="4" fill="#a06cd5" opacity="0.4"/>
    <rect x="28" y="80" width="60" height="8" rx="4" fill="#a06cd5" opacity="0.5"/>
    <!-- Bubble tail -->
    <polygon points="140,150 160,150 170,180" fill="url(#bubble3)" opacity="0.9"/>
  </g>

  <!-- Front bubble (red/coral) - prominent, top-right -->
  <g transform="translate(200, 180)">
    <rect x="0" y="0" width="230" height="160" rx="24" ry="24" fill="url(#bubble1)"/>
    <!-- Terminal prompt style -->
    <text x="28" y="56" font-family="monospace" font-size="28" font-weight="bold" fill="#fff" opacity="0.95">&gt;_</text>
    <rect x="80" y="42" width="110" height="8" rx="4" fill="#fff" opacity="0.4"/>
    <rect x="28" y="72" width="160" height="8" rx="4" fill="#fff" opacity="0.3"/>
    <rect x="28" y="94" width="100" height="8" rx="4" fill="#fff" opacity="0.25"/>
    <rect x="28" y="116" width="140" height="8" rx="4" fill="#fff" opacity="0.2"/>
    <!-- Bubble tail -->
    <polygon points="180,160 200,160 210,192" fill="url(#bubble1)"/>
  </g>

  <!-- "ChatMUX" label - bottom center -->
  <rect x="96" y="390" width="320" height="64" rx="32" ry="32" fill="#e94560"/>
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="2">ChatMUX</text>
</svg>
